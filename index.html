<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus 2.0 — Coming Soon</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0b0a13;
      color: #fff;
      font-family: 'Space Grotesk', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    h1 {
      font-size: 3rem;
      font-weight: 700;
      letter-spacing: 6px;
      background: linear-gradient(135deg, #a29bfe, #6c5ce7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 16px;
    }
    .tagline {
      color: #a29bfe;
      font-size: 1rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 30px;
    }
    .message {
      color: #888;
      font-size: 0.95rem;
      max-width: 400px;
      line-height: 1.6;
      margin-bottom: 30px;
    }
    .back-link {
      display: inline-block;
      padding: 12px 28px;
      background: #6c5ce7;
      color: #fff;
      text-decoration: none;
      border-radius: 12px;
      font-weight: 600;
      transition: all 0.3s ease;
    }
    .back-link:hover {
      background: #4e3ec9;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(108, 92, 231, 0.5);
    }
    .pulse {
      width: 10px;
      height: 10px;
      background: #2ecc71;
      border-radius: 50%;
      margin: 0 auto 20px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.7); }
      50% { opacity: 0.7; box-shadow: 0 0 0 10px rgba(46, 204, 113, 0); }
    }
  </style>
</head>
<body>
  <div class="pulse"></div>
  <h1>NEXUS 2.0</h1>
  <p class="tagline">Coming Soon</p>
  <p class="message">
    Something new is being built. A better, faster, more refined version of Nexus. Stay tuned.
  </p>
  <a href="https://nexus-project-alpha8.vercel.app" class="back-link">← Back to Nexus 1.0</a>
</body>
</html>
